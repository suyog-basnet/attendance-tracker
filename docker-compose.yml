version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ku_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kutracker
      POSTGRES_PASSWORD: kutracker_secret
      POSTGRES_DB: ku_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  pgdata:
